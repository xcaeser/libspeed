name: release

# Every push to main is tested; a version in build.zig.zon with no release yet
# is built, tagged and published.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  # Windows and macOS binaries are cross-compiled on Linux in the release job;
  # this runs the tests and the CLI for real on each.
  hosts:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: zig@0.17.0
      - run: zig build test
      - run: zig build run -- run --json

  release:
    needs: hosts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: zig@0.17.0 nfpm@2.48.0
      - run: zig build test
      - name: Find an unreleased version
        id: version
        run: |
          tag="v$(sed -n 's/.*\.version = "\(.*\)".*/\1/p' build.zig.zon)"
          gh release view "$tag" > /dev/null 2>&1 || echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.tag
        run: zig build release
      - if: steps.version.outputs.tag
        run: gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes zig-out/release/*
      - name: Publish to npm
        if: steps.version.outputs.tag && env.NODE_AUTH_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          # Platform packages first: the main one depends on them.
          for dir in zig-out/npm/*/; do
            [ "$dir" = zig-out/npm/speed/ ] || npm publish --access public "$dir"
          done
          npm publish --access public zig-out/npm/speed

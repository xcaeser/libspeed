name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: zig@0.17.0 bun
      - run: zig build test
      - run: bun scripts/package.ts
      - name: Check the tag matches build.zig.zon
        run: test "v$(jq -r .version npm/package.json)" = "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes npm/dist/release/*
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          for dir in npm/dist/*/; do
            [ "$dir" = npm/dist/release/ ] || npm publish --access public "$dir"
          done
          npm publish --access public npm
